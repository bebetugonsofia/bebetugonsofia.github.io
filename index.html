<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sofia's Y2K Portfolio</title>
  <link rel="stylesheet" href="style.css">
  
  <!-- Fun Bubbly Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DynaPuff:wght@700&family=Pixelify+Sans:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- 1. PORTFOLIO TITLE & DIVIDERS -->
  <header class="portfolio-header">
    <h1>PoRtFoLiO</h1>
  </header>
  <div class="gingham-border"></div>
  <div class="scallop-border"></div>
  <div class="food-border">🍟 🍔 🍕 🍟 🍔 🍕 🍟 🍔 🍕 🍟 🍔 🍕 🍟 🍔 🍕 🍟 🍔 🍕 🍟 🍔 🍕</div>

  <!-- 2. ABOUT ME INTRO (Profile + Sticky Note) -->
  <section class="hero-section">
    <div class="checkerboard-bg"></div>
    
    <div class="profile-container">
      <div class="orange-target">
        <!-- Add your profile image file here -->
        <img src="profile.png" alt="Sofia" class="profile-pic" onerror="this.style.display='none'"> 
      </div>
    </div>

    <div class="sticky-note">
      <p>Hi, I'm Sofia! Welcome to my portfolio. I'm a Computer Science student showcasing all my work &lt;3.</p>
    </div>
  </section>

  <!-- 3. SOCIAL LINKS -->
  <main class="scrapbook-container">
    <div class="retro-stripes"></div>

    <!-- STICKER PLACEHOLDERS (Export from Canva) -->
    <img src="megaphone.png" class="sticker megaphone" onerror="this.style.display='none'">
    <img src="cat1.png" class="sticker cat-top" onerror="this.style.display='none'">
    <img src="cat2.png" class="sticker cat-bottom" onerror="this.style.display='none'">

    <h2 class="section-title">SoCiaLs</h2>

    <div class="scrapbook-content socials-stack">
      
      <!-- Linked In -->
      <a href="https://www.linkedin.com/in/sofia-erika-p-babatugon-34244b430/" target="_blank" class="y2k-box">
        <div class="y2k-header">♥♥♥♥</div>
        <div class="y2k-body icon-box">
          <img src="linkedin-icon.png" alt="in" class="social-icon" onerror="this.alt='[ in ]'">
        </div>
      </a>

      <!-- Facebook -->
      <a href="https://www.facebook.com/sofie.975467" target="_blank" class="y2k-box">
        <div class="y2k-header">♥♥♥♥</div>
        <div class="y2k-body icon-box">
          <img src="facebook-icon.png" alt="f" class="social-icon" onerror="this.alt='[ f ]'">
        </div>
      </a>

      <!-- Instagram -->
      <a href="https://www.instagram.com/disnotwhoyowthink/" target="_blank" class="y2k-box">
        <div class="y2k-header">♥♥♥♥</div>
        <div class="y2k-body icon-box">
          <img src="instagram-icon.png" alt="ig" class="social-icon" onerror="this.alt='[ ig ]'">
        </div>
      </a>

      <!-- GitHub -->
      <a href="https://github.com/bebetugonsofia" target="_blank" class="y2k-box">
        <div class="y2k-header">♥♥♥♥</div>
        <div class="y2k-body icon-box">
          <img src="github-icon.png" alt="gh" class="social-icon" onerror="this.alt='[ gh ]'">
        </div>
      </a>

    </div>
  </main>

  <!-- FILMSTRIP DIVIDER -->
  <div class="filmstrip-container">
    <div class="filmstrip"></div>
    <div class="filmstrip secondary-strip"></div>
  </div>

</body>
</html>
