<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sofia's Portfolio</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="home-page">
    <!-- Header Navigation -->
    <header class="header">
      <nav class="navbar">
        <a href="index.html" class="nav-link active">Home</a>
        <a href="about.html" class="nav-link">About Me</a>
        <a href="achievements.html" class="nav-link">Achievements</a>
        <a href="activities.html" class="nav-link">Class Activities</a>
        <a href="projects.html" class="nav-link">Projects</a>
      </nav>
    </header>

    <!-- Main Container -->
    <main class="portfolio-container">
      <!-- Hero Title Section -->
      <section class="hero-wrapper">
        <h1 class="hero-title">
          <span class="title-line">Sofia's</span>
          <span class="title-line portfolio-line">
            Portfolio
            <img src="assets/shine.png" alt="Pixel Star" class="hero-star" />
          </span>
        </h1>
      </section>

      <!-- Markdown Converter Section -->
      <section class="converter-section">
        <h2 class="converter-header-title">◇ MARKDOWN CONVERTER ◇</h2>
        <div id="container">
          <div class="container">
            <h2>Markdown Input:</h2>
            <textarea
              id="markdown-input"
              placeholder="Enter your markdown here..."
            ></textarea>
          </div>

          <div class="container">
            <h2>Raw HTML Output:</h2>
            <div id="html-output"></div>
          </div>

          <div class="container">
            <h2>HTML Preview:</h2>
            <div id="preview"></div>
          </div>
        </div>
      </section>
    </main>

    <!-- JavaScript Logic -->
    <script src="script.js"></script>
  </body>
</html>
